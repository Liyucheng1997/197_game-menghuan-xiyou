<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html,body { height:100%; background:#1a1208; display:flex; align-items:center; justify-content:center;
    font-family:"KaiTi","STKaiti","楷体","SimSun",serif; }
  #stage { position:relative; width:960px; height:600px; overflow:hidden; border:4px solid #6b4a1f;
    border-radius:10px; box-shadow:0 0 40px rgba(0,0,0,.8), inset 0 0 8px rgba(0,0,0,.5); background:#e8d5a3; }

  .screen { position:absolute; inset:0; display:none; }
  .screen.active { display:block; }

  button { font-family:inherit; cursor:pointer; }
  .mh-btn { background:linear-gradient(#f5e3b0,#d9b56d); border:2px solid #8b5a2b; border-radius:8px;
    padding:6px 18px; font-size:17px; color:#5a3410; box-shadow:0 2px 0 #8b5a2b, inset 0 1px 0 #fff8; }
  .mh-btn:hover { filter:brightness(1.08); }
  .mh-btn:active { transform:translateY(2px); box-shadow:0 0 0 #8b5a2b; }
  .mh-btn:disabled { opacity:.45; cursor:default; }

  /* ---------- 标题画面 ---------- */
  #screen-title { background:linear-gradient(#f7e9c4 0%, #eed79e 55%, #d9b877 100%); text-align:center; }

  #logo { margin-top:120px; font-size:96px; letter-spacing:14px; color:#8b2f10;
    text-shadow:3px 3px 0 #f7e9c4, 6px 6px 0 #b8863b, 0 0 26px rgba(139,47,16,.35); font-weight:bold; }
  #logo-sub { font-size:24px; letter-spacing:20px; color:#6b4a1f; margin-top:8px; }
  #title-btns { margin-top:60px; display:flex; gap:30px; justify-content:center; }
  #title-btns .mh-btn { font-size:22px; padding:10px 34px; }
  #title-tip { position:absolute; bottom:22px; width:100%; color:#8a6a3a; font-size:15px; letter-spacing:2px; }

  /* ---------- 选人 ---------- */

  #screen-select h2 { color:#7a3b12; font-size:34px; letter-spacing:8px; }
  #class-cards { display:flex; gap:26px; justify-content:center; margin-top:30px; }

    cursor:pointer; transition:transform .15s, box-shadow .15s; }
  .card:hover { transform:translateY(-6px); }
  .card.sel { border-color:#c23a10; box-shadow:0 0 18px rgba(194,58,16,.55); transform:translateY(-6px); }
  .card .face { font-size:74px; }
  .card h3 { font-size:24px; color:#5a3410; margin:6px 0 2px; }
  .card .school { color:#a04010; font-size:16px; }
  .card .desc { font-size:14px; color:#7a6237; margin-top:8px; line-height:1.5; min-height:64px; }
  .card .stats { font-size:13px; color:#5a3410; margin-top:6px; text-align:left; padding:0 10px; }
  #name-row { margin-top:34px; font-size:20px; color:#5a3410; }
  #inp-name { font-family:inherit; font-size:19px; padding:5px 10px; border:2px solid #a9803f; border-radius:6px;
    background:#fffbe9; width:180px; color:#5a3410; }

  #hud { height:74px; background:linear-gradient(#f5e6bd,#e2c583); border-bottom:3px solid #8b5a2b;

  #hud-name { font-size:16px; color:#5a3410; font-weight:bold; }

  .npc, .exit { position:absolute; transform:translate(-50%,-100%); text-align:center; cursor:pointer; z-index:3; }
  .npc .emoji { font-size:44px; display:block; filter:drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
  .npc .tag, .exit .tag { display:inline-block; font-size:13px; color:#fffbe9; background:rgba(90,52,16,.85);

  .npc:hover .emoji { transform:scale(1.15); }
  .exit .emoji { font-size:36px; display:block; animation:bounce 1.2s ease-in-out infinite; }

  #player-sprite { position:absolute; transform:translate(-50%,-100%); text-align:center; z-index:4; pointer-events:none; }
  #player-sprite .emoji { font-size:48px; display:block; filter:drop-shadow(0 4px 3px rgba(0,0,0,.35)); }
  #player-sprite .tag { font-size:13px; color:#fff; text-shadow:0 0 4px #000, 0 0 4px #000; }
  #player-sprite.walking .emoji { animation:walkbob .3s ease-in-out infinite; }

  #log .world { color:#7ecbff; }

  .sprite .sp-hp { width:70px; height:7px; margin:2px auto 0; background:#333; border:1px solid #000;

  .sprite .sp-hp i { display:block; height:100%; background:linear-gradient(#8ae06a,#2a9a10); transition:width .3s; }
  .sprite.dead { opacity:.25; filter:grayscale(1); }
  .sprite.targetable { cursor:pointer; }
  .sprite.targetable::after { content:"▼"; position:absolute; top:-26px; left:50%; transform:translateX(-50%);
    color:#ff3a10; font-size:20px; animation:bounce .7s infinite; text-shadow:0 0 4px #fff; }
  .sprite.acting { z-index:9; }
  .dmgpop { position:absolute; transform:translate(-50%,-100%); font-size:26px; font-weight:bold; color:#ff4a2a;

  .dmgpop.info { color:#ffd76a; font-size:20px; }

  @keyframes shake { 0%,100%{margin-left:0;} 25%{margin-left:-7px;} 75%{margin-left:7px;} }

  #modal-title { font-size:22px; color:#8b2f10; text-align:center; letter-spacing:4px; border-bottom:2px solid #d9b56d;

  #modal-body { flex:1; overflow-y:auto; padding:12px 2px; font-size:16px; color:#5a3410; line-height:1.7; }

  #modal-body .row .mh-btn { font-size:14px; padding:3px 12px; }
  #modal-close { align-self:center; margin-top:10px; }

  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:40; }
  #flash.go { animation:flashanim .55s ease-out; }
  @keyframes flashanim { 0%{opacity:0;} 30%{opacity:1;} 100%{opacity:0;} }

  #btn-bgm { position:absolute; top:8px; right:8px; z-index:50; width:38px; height:38px; border-radius:50%;
    border:2px solid #8b5a2b; background:#f5e3b0; font-size:18px; }
</style>

const SAVE_KEY = 'mhxy_huaijiu_save_v1';
let S = null;            // 玩家存档
let inBattle = false;

function classStats(cls, lv){
  const c = CLASSES[cls], g = c.grow, b = c.base, n = lv-1;
  return { maxHp:Math.round(b.hp+g.hp*n), maxMp:Math.round(b.mp+g.mp*n),
           atk:Math.round(b.atk+g.atk*n), mag:Math.round(b.mag+g.mag*n),
           def:Math.round(b.def+g.def*n), spd:Math.round(b.spd+g.spd*n) };
}
function expNeed(lv){ return lv*120; }
function petStats(mid, lv){
  const m = MONSTERS[mid], f = 1+(lv-1)*0.3;
  return { maxHp:Math.round(m.hp*0.95*f), atk:Math.round(m.atk*1.05*f),
           def:Math.round(m.def*f), spd:Math.round(m.spd*f) };
}
function petExpNeed(lv){ return lv*100; }

function newGame(cls, name){
  const st = classStats(cls,1);
  S = { cls, name, lv:1, exp:0, money:300,
        hp:st.maxHp, mp:st.maxMp, ...st,
        items:{ baozi:3, jinchuang:1, dingshen:1 },
        pet:null, scene:'jianye', px:30, py:72 };
}
function save(){ if(S) localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
function load(){
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(!d || !d.cls) return null;
    if(d.cls==='xys') d.cls='ltz';
    if(!CLASSES[d.cls]) return null;
    if(!SCENES[d.scene]) d.scene='jianye';
    return d; }
  catch(e){ return null; }
}

/* ==================== 通用 UI ==================== */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(el=>el.classList.remove('active'));
  $(id).classList.add('active');
}
function log(msg, cls='sys'){
  const el = $('#log'); const p = document.createElement('div');
  p.className = cls; p.textContent = msg; el.appendChild(p);
  while(el.children.length>40) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
function openModal(title, bodyHTML){
  $('#modal-title').textContent = title;
  $('#modal-body').innerHTML = bodyHTML;
  $('#modal').classList.add('show');
}
function closeModal(){ $('#modal').classList.remove('show'); }
$('#modal-close').onclick = closeModal;

function updateHUD(){
  if(!S) return;
  $('#hud-avatar').innerHTML = World.portrait(S.cls);
  $('#hud-name').textContent = `${S.name} · ${CLASSES[S.cls].name} Lv.${S.lv}`;
  $('#hud-hp-fill').style.width = (100*S.hp/S.maxHp)+'%';
  $('#hud-mp-fill').style.width = (100*S.mp/S.maxMp)+'%';
  $('#hud-exp-fill').style.width = (100*S.exp/expNeed(S.lv))+'%';
  $('#hud-money').textContent = `💰 ${S.money} 两`;
  $('#hud-scene').textContent = SCENES[S.scene].name;
  $('#hud-info').title = `气血 ${S.hp}/${S.maxHp}　魔法 ${S.mp}/${S.maxMp}　经验 ${S.exp}/${expNeed(S.lv)}`;
  if($('#coordinates')) Classic.refresh();
}

/* ==================== 音效 / BGM ==================== */
let AC = null, bgmOn = false, bgmTimer = null, bgmStep = 0;
function ac(){ if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)(); return AC; }
function tone(freq, dur, type='triangle', vol=0.12, delay=0){
  try{
    const a = ac(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, a.currentTime+delay);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+delay+dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime+delay); o.stop(a.currentTime+delay+dur+0.05);
  }catch(e){}
}
const sfx = {
  hit(){ tone(180,0.12,'square',0.1); tone(90,0.15,'sawtooth',0.08,0.02); },
  magic(){ tone(660,0.1,'sine',0.1); tone(880,0.12,'sine',0.09,0.06); tone(1100,0.16,'sine',0.08,0.12); },
  heal(){ tone(523,0.12,'sine',0.1); tone(659,0.14,'sine',0.1,0.1); tone(784,0.2,'sine',0.1,0.2); },
  levelup(){ [523,659,784,1046].forEach((f,i)=>tone(f,0.22,'triangle',0.14,i*0.13)); },
  catch(){ [784,988,1175].forEach((f,i)=>tone(f,0.16,'triangle',0.13,i*0.1)); },
  flee(){ tone(400,0.1,'sine',0.1); tone(300,0.1,'sine',0.1,0.08); tone(200,0.14,'sine',0.1,0.16); },
  encounter(){ tone(220,0.14,'sawtooth',0.12); tone(165,0.2,'sawtooth',0.12,0.1); },
  click(){ tone(880,0.05,'sine',0.06); },
};
// 一段温柔的五声音阶小调，聊表长安城的月色
const N = { C4:261.6, D4:293.7, E4:329.6, G4:392.0, A4:440.0, C5:523.3, D5:587.3, E5:659.3 };
const BGM = [ [N.E4,1],[N.G4,1],[N.A4,1],[N.C5,2],[N.A4,1],[N.G4,1],[N.E4,2],
              [N.D4,1],[N.E4,1],[N.G4,1],[N.E4,2],[N.D4,1],[N.C4,3],
              [N.A4,1],[N.C5,1],[N.D5,1],[N.E5,2],[N.D5,1],[N.C5,1],[N.A4,2],
              [N.G4,1],[N.A4,1],[N.C5,1],[N.A4,1],[N.G4,1],[N.E4,1],[N.D4,1],[N.C4,3] ];
function bgmTick(){
  const [f,beats] = BGM[bgmStep % BGM.length];
  tone(f, beats*0.32, 'triangle', 0.07);
  tone(f/2, beats*0.36, 'sine', 0.04);
  bgmStep++;
  bgmTimer = setTimeout(bgmTick, beats*300);
}
$('#btn-bgm').onclick = ()=>{
  bgmOn = !bgmOn;
  $('#btn-bgm').textContent = bgmOn ? '🔊' : '🔇';
  if(bgmOn){ ac().resume && ac().resume(); bgmTick(); }
  else { clearTimeout(bgmTimer); }
};

/* ==================== 地图 ==================== */
let pPos = {x:300, y:400};       // 玩家像素坐标
let moveTarget = null, pendingAction = null, walkDistAcc = 0, movePath = [];
let worldChatTimer = null;

function pct2px(area, x, y){ return { x: area.clientWidth*x/100, y: area.clientHeight*y/100 }; }

function enterMap(sceneId, px, py){
  S.scene = sceneId;
  const sc = SCENES[sceneId];
  const viewport = $('#map-area');
  viewport.className = sc.cls;
  viewport.innerHTML = '';
  const area = World.create(viewport,sceneId);
  showScreen('#screen-map');
  Classic.mapArt(area, sceneId);
  Classic.music(sceneId);
  // 装饰
  sc.decor.forEach(d=>{
    const el = document.createElement('div'); el.className='decor';
    el.style.left = d.x+'%'; el.style.top = d.y+'%'; el.style.fontSize = d.s+'px';
    el.textContent = d.e; area.appendChild(el);
  });
  // NPC
  sc.npcs.forEach(n=>{
    const el = document.createElement('div'); el.className='npc';
    el.style.left = n.x+'%'; el.style.top = n.y+'%';
    el.innerHTML = `<span class="emoji">${Classic.actor(n.id)}</span><span class="tag">${n.name}</span>`;
    el.onclick = ev=>{ ev.stopPropagation(); walkThen(n.x, n.y, ()=>npcTalk(n.id)); };
    area.appendChild(el);
  });
  // 出口
  sc.exits.forEach(x=>{
    const el = document.createElement('div'); el.className='exit';
    el.style.left = x.x+'%'; el.style.top = x.y+'%';
    el.innerHTML = `<span class="emoji">${x.emoji}</span><span class="tag">${x.name}</span>`;
    el.onclick = ev=>{ ev.stopPropagation(); walkThen(x.x, x.y, ()=>{
      log(`来到了 ${SCENES[x.to].name}。`, 'sys');
      if(SCENES[x.to].wild) log('这里野外妖怪出没，走路时小心「踩雷」遇敌！', 'battle');
      enterMap(x.to, x.px, x.py); save();
    }); };
    area.appendChild(el);
  });
  // 玩家
  const p = document.createElement('div'); p.id='player-sprite';
  p.innerHTML = `<span class="emoji">${Classic.actor(S.cls)}</span><span class="tag">${Classic.escape(S.name)}</span>`;
  area.appendChild(p);
  const pos = World.snap(sceneId,px!==undefined?px:S.px,py!==undefined?py:S.py);
  pPos = pos; moveTarget = null; pendingAction = null; movePath=[];
  S.px=100*pos.x/area.clientWidth; S.py=100*pos.y/area.clientHeight;
  placePlayer();
  updateHUD();
}
function placePlayer(){
  const p = $('#player-sprite'); if(!p) return;
  p.style.left = pPos.x+'px'; p.style.top = pPos.y+'px';
  World.follow();
}
function walkThen(xPct, yPct, cb){
  const area = $('#map-world');
  const t = pct2px(area, xPct, yPct);
  Classic.moveTo(t.x,t.y+6,cb);
}
$('#map-area').addEventListener('click', e=>{
  if(inBattle) return;
  const r = $('#map-area').getBoundingClientRect();
  Classic.moveTo((e.clientX-r.left)*$('#map-area').clientWidth/r.width+World.camera.x,(e.clientY-r.top)*$('#map-area').clientHeight/r.height+World.camera.y);
});
// 移动主循环（用 setInterval 而非 rAF，避免标签页后台时角色卡住）
function mapLoop(){
  if(inBattle || !S || $('#modal').classList.contains('show') || !$('#screen-map').classList.contains('active')) return;
  const p = $('#player-sprite'); if(!p) return;
  if(moveTarget){
    const dx = moveTarget.x-pPos.x, dy = moveTarget.y-pPos.y;
    const dist = Math.hypot(dx,dy);
    if(dist < 4){
      pPos={...moveTarget};placePlayer();
      if(movePath.length){moveTarget=movePath.shift();return;}
      moveTarget = null; p.classList.remove('walking');
      const act = pendingAction; pendingAction = null;
      if(act) act();
    } else {
      const step = 3.2;
      pPos.x += dx/dist*step; pPos.y += dy/dist*step;
      p.classList.add('walking');
      placePlayer();
      // 野外踩雷
      if(SCENES[S.scene].wild){
        walkDistAcc += step;
        if(walkDistAcc > 110){
          walkDistAcc = 0;
          if(Math.random() < 0.30){
            moveTarget = null; pendingAction = null; p.classList.remove('walking');
            triggerEncounter();
          }
        }
      }
    }
  }
  // 记录百分比位置用于存档
  const area = $('#map-world');
  S.px = 100*pPos.x/area.clientWidth; S.py = 100*pPos.y/area.clientHeight;
  Classic.refresh();
}
setInterval(mapLoop, 16);

    openModal('守城老兵', `<div style="font-size:17px;line-height:2">${tips[ri(0,tips.length-1)]}</div>`);

window.buyItem = function(iid){
  const it = ITEMS[iid];
  if(S.money < it.price){ log('银两不足！', 'battle'); return; }
  S.money -= it.price;
  S.items[iid] = (S.items[iid]||0)+1;
  sfx.click(); log(`购买了 ${it.emoji}${it.name} ×1。`); save(); updateHUD();
  npcTalk('yao'); // 刷新弹窗
};
window.restInn = function(){
  if(S.money < 30){ log('银两不足！', 'battle'); return; }
  S.money -= 30;
  S.hp = S.maxHp; S.mp = S.maxMp;
  if(S.pet){ S.pet.hp = S.pet.maxHp; }
  sfx.heal(); log('美美地睡了一觉，人和召唤兽都精神饱满！'); save(); updateHUD();
  closeModal();
};

/* ==================== 背包 / 召唤兽 ==================== */
function openBag(){
  let html = '';
  let empty = true;
  for(const [iid,cnt] of Object.entries(S.items)){
    if(cnt<=0) continue; empty = false;
    const it = ITEMS[iid];
    html += `<div class="row"><span>${it.emoji} ${it.name} ×${cnt} <small style="color:#a07a3a">${it.desc}</small></span>
      <span><button class="mh-btn" onclick="useItemMap('${iid}','me')">自己用</button>
      ${S.pet?`<button class="mh-btn" onclick="useItemMap('${iid}','pet')">喂宠物</button>`:''}</span></div>`;
  }
  if(empty) html = '<div style="text-align:center;padding:30px 0">背包空空如也……去药店买点吧。</div>';
  openModal('背包', html);
}
window.useItemMap = function(iid, who){
  if((S.items[iid]||0) <= 0) return;
  const it = ITEMS[iid];
  if(who==='pet' && !S.pet) return;
  const t = who==='pet' ? S.pet : S;
  if(it.heal.hp && t.hp >= t.maxHp){ log('气血已满，不用浪费药啦。'); return; }
  if(it.heal.mp && t.mp !== undefined && t.mp >= t.maxMp){ log('魔法已满，不用浪费药啦。'); return; }
  S.items[iid]--;
  if(it.heal.hp) t.hp = clamp(t.hp+it.heal.hp, 0, t.maxHp);
  if(it.heal.mp && t.mp !== undefined) t.mp = clamp(t.mp+it.heal.mp, 0, t.maxMp);
  sfx.heal();
  log(`${who==='pet'?S.pet.name:'你'} 使用了 ${it.name}。`);
  save(); updateHUD(); openBag();
};

/* ==================== 战斗 ==================== */
let B = null; // 战斗状态

function blog(msg){
  const el = $('#battle-log'); const p = document.createElement('div');
  p.textContent = msg; el.appendChild(p);
  while(el.children.length>30) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}
function physDmg(a, t){
  let d = a.atk * rnd(0.88,1.12) - t.def*0.6;
  if(t.defending) d *= 0.5;
  return Math.max(1, Math.round(d));
}
function magDmg(a, t, mult){
  let d = (a.mag||a.atk) * mult * rnd(0.9,1.1) - t.def*0.35;
  if(t.defending) d *= 0.5;
  return Math.max(1, Math.round(d));
}

function makeSprite(actor, x, y){
  const el = document.createElement('div');
  el.className = 'sprite '+(actor.side==='enemy'?'enemy':'ally');
  el.innerHTML = `<span class="emoji">${Classic.actor(actor.kind==='player'?S.cls:actor.mid||S.pet?.mid||'bing')}</span>
    <span class="sp-name">${Classic.escape(actor.name)} Lv.${actor.lv}</span>
    <div class="sp-hp"><i></i></div>`;
  el.style.left = x+'%'; el.style.top = y+'%';
  actor.el = el; actor.bx = x; actor.by = y;
  el.onclick = ()=>{ if(B && B.pickResolve && el.classList.contains('targetable')) B.pickResolve(actor); };
  $('#battle-field').appendChild(el);
  refreshSprite(actor);
}
function refreshSprite(a){
  if(!a.el) return;
  a.el.querySelector('.sp-hp i').style.width = (100*clamp(a.hp,0,a.maxHp)/a.maxHp)+'%';
  a.el.classList.toggle('dead', !a.alive);
}
function popup(target, text, cls=''){
  const el = document.createElement('div');
  el.className = 'dmgpop '+cls; el.textContent = text;
  el.style.left = target.bx+'%';
  el.style.top = `calc(${target.by}% - 60px)`;
  $('#battle-field').appendChild(el);
  setTimeout(()=>el.remove(), 900);
}

function triggerEncounter(){
  if(inBattle) return;
  inBattle = true;
  sfx.encounter();
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  log('遭遇了妖怪！', 'battle');
  setTimeout(startBattle, 380);
}

function startBattle(){
  const field = $('#battle-field');
  field.innerHTML = '<div class="bf-decor" style="left:4%;top:6%;font-size:44px">🌄</div>' +
                    '<div class="bf-decor" style="right:6%;top:10%;font-size:36px">☁️</div>' +
                    '<div class="bf-decor" style="left:46%;top:78%;font-size:30px;opacity:.5">🌿</div>';
  $('#battle-log').innerHTML = '';
  $('#battle-menu').innerHTML = '';
  $('#battle-result').classList.remove('show');

  // 我方
  const allies = [];
  const me = { side:'ally', kind:'player', name:S.name, emoji:CLASSES[S.cls].emoji, lv:S.lv,
    hp:S.hp, maxHp:S.maxHp, mp:S.mp, maxMp:S.maxMp, atk:S.atk, mag:S.mag, def:S.def, spd:S.spd,
    alive:S.hp>0, defending:false };
  allies.push(me);
  let pet = null;
  if(S.pet && S.pet.hp>0){
    pet = { side:'ally', kind:'pet', savedPet:S.pet, mid:S.pet.mid, name:S.pet.name, emoji:S.pet.emoji, lv:S.pet.lv,
      hp:S.pet.hp, maxHp:S.pet.maxHp, mag:0, atk:S.pet.atk, def:S.pet.def, spd:S.pet.spd,
      alive:true, defending:false };
    allies.push(pet);
  }
  // 敌方（1~3 只，按玩家等级缩放）
  const pool = SCENES[S.scene].pool || ['dahaigui','haimaochong'];
  const n = ri(1, 3);
  const enemies = [];
  for(let i=0;i<n;i++){
    const mid = pool[ri(0,pool.length-1)];
    const m = MONSTERS[mid];
    const lv = Math.max(1, S.lv + ri(-1,1));
    const f = 1 + (lv-1)*0.28;
    enemies.push({ side:'enemy', kind:'monster', mid, name:m.name, emoji:m.emoji, lv,
      hp:Math.round(m.hp*f), maxHp:Math.round(m.hp*f), mag:0,
      atk:Math.round(m.atk*f), def:Math.round(m.def*f), spd:Math.round(m.spd*f),
      exp:Math.round(m.exp*(1+(lv-1)*0.25)), money:Math.round(m.money*(1+(lv-1)*0.2)),
      catch:m.catch, alive:true, defending:false });
  }
  B = { me, pet, allies, enemies, over:false, pickResolve:null, round:0 };
  field.innerHTML=''; Classic.mapArt(field, S.scene);

  // 布阵：敌左上，我右下（经典斜排）
  const ePos = [[22,42],[12,58],[31,28]];
  enemies.forEach((e,i)=> makeSprite(e, ePos[i][0], ePos[i][1]));
  makeSprite(me, 74, 62);
  if(pet) makeSprite(pet, 61, 78);

  showScreen('#screen-battle');
  Classic.music('battle');
  blog(`野外遭遇：${enemies.map(e=>e.name+' Lv.'+e.lv).join('、')}！`);
  battleLoop();
}

function aliveOf(list){ return list.filter(a=>a.alive); }
function battleOverCheck(){
  if(aliveOf(B.enemies).length===0){ B.over='win'; return true; }
  if(!B.me.alive){ B.over='lose'; return true; }
  return false;
}

/* --- 菜单 & 目标选择 --- */
function menu(items, cancelable){
  const box = $('#battle-menu');
  return new Promise((res, rej)=>{
    box.innerHTML = '';
    items.forEach(it=>{
      const b = document.createElement('button');
      b.className = 'mh-btn'; b.textContent = it.label;
      if(it.disabled) b.disabled = true;
      b.onclick = ()=>{ sfx.click(); res(it.id); };
      box.appendChild(b);
    });
    if(cancelable){
      const c = document.createElement('button');
      c.className = 'mh-btn'; c.textContent = '↩ 返回';
      c.onclick = ()=>{ sfx.click(); rej('cancel'); };
      box.appendChild(c);
    }
  });
}
function pickTarget(cands, tipText){
  const box = $('#battle-menu');
  return new Promise((res, rej)=>{
    box.innerHTML = `<div class="menu-tip">${tipText}</div>`;
    const c = document.createElement('button');
    c.className = 'mh-btn'; c.textContent = '↩ 取消';
    c.onclick = ()=>{ cleanup(); rej('cancel'); };
    box.appendChild(c);
    cands.forEach(a=>a.el.classList.add('targetable'));
    B.pickResolve = a=>{ cleanup(); res(a); };
    function cleanup(){
      B.pickResolve = null;
      B.allies.concat(B.enemies).forEach(a=>a.el && a.el.classList.remove('targetable'));
    }
  });
}

async function getPlayerCommand(me = B.me){
  while(true){
    try{
      $('#round-label').textContent=`第 ${B.round} 回合 · ${me.kind==='pet'?'召唤兽':'人物'}指令`;
      const cmd = await menu(me.kind==='pet' ? [{id:'atk',label:'攻击'},{id:'def',label:'防御'}] : [
        {id:'atk', label:'⚔️ 攻击'}, {id:'skill', label:'📜 法术'},
        {id:'def', label:'🛡️ 防御'}, {id:'item', label:'🎒 道具'},
        {id:'catch', label:'🪤 捕捉'}, {id:'flee', label:'💨 逃跑'},
      ], false);
      if(cmd==='atk'){
        const t = await pickTarget(aliveOf(B.enemies), '选择攻击目标：');
        return {type:'atk', actor:me, target:t};
      }
      if(cmd==='skill'){
        const sk = await menu(CLASSES[S.cls].skills.map(id=>({
          id, label:`${SKILLS[id].name}(${id==='hsqj'?'气血':SKILLS[id].mp})`, disabled:me.mp<SKILLS[id].mp || (id==='hsqj' && me.hp<=me.maxHp*.5) })), true);
        const skill = SKILLS[sk];
        if(skill.type==='heal'){
          const t = await pickTarget(aliveOf(B.allies), `${skill.name}：选择要治疗的队友`);
          return {type:'skill', actor:me, skill:sk, target:t};
        }
        if(skill.aoe) return {type:'skill', actor:me, skill:sk, target:null};
        const t = await pickTarget(aliveOf(B.enemies), `${skill.name}：选择目标`);
        return {type:'skill', actor:me, skill:sk, target:t};
      }
      if(cmd==='def') return {type:'def', actor:me};
      if(cmd==='item'){
        const usable = Object.entries(S.items).filter(([id,c])=>c>0);
        if(usable.length===0){ blog('背包里没有道具了！'); continue; }
        const iid = await menu(usable.map(([id,c])=>({id, label:`${ITEMS[id].emoji}${ITEMS[id].name}×${c}`})), true);
        const t = await pickTarget(aliveOf(B.allies), `${ITEMS[iid].name}：选择使用对象`);
        return {type:'item', actor:me, item:iid, target:t};
      }
      if(cmd==='catch'){
        const cands = aliveOf(B.enemies).filter(e=>e.catch);
        if(cands.length===0){ blog('这里没有能捕捉的妖怪！'); continue; }
        const t = await pickTarget(cands, '选择要捕捉的妖怪（血越少越好抓）：');
        return {type:'catch', actor:me, target:t};
      }
      if(cmd==='flee') return {type:'flee', actor:me};
    }catch(e){ if(e!=='cancel') throw e; }
  }
}

/* --- 动作执行 --- */
async function animAttack(a, t){
  const f = $('#battle-field');
  const dx = (t.bx-a.bx)/100*f.clientWidth * 0.72;
  const dy = (t.by-a.by)/100*f.clientHeight * 0.72;
  a.el.classList.add('acting');
  a.el.style.transform = `translate(calc(-50% + ${dx}px), calc(-100% + ${dy}px))`;
  await sleep(270);
  t.el.classList.add('hit'); setTimeout(()=>t.el.classList.remove('hit'), 300);
  a.el.style.transform = '';
  await sleep(270);
  a.el.classList.remove('acting');
}
function applyDamage(t, dmg){
  t.hp = clamp(t.hp-dmg, 0, t.maxHp);
  popup(t, '-'+dmg);
  if(t.hp<=0){ t.alive = false; }
  refreshSprite(t);
}
function retarget(actor, orig){
  if(orig && orig.alive) return orig;
  const list = actor.side==='ally' ? aliveOf(B.enemies) : aliveOf(B.allies);
  return list.length ? list[ri(0,list.length-1)] : null;
}

async function execAction(act){
  const a = act.actor;
  if(!a.alive || B.over) return;
  if(act.type==='rest'){ popup(a,'休息','info'); blog(`${a.name} 本回合休息。`); return; }
  if(act.type==='atk'){
    const t = retarget(a, act.target); if(!t) return;
    sfx.hit();
    await animAttack(a, t);
    const d = physDmg(a, t);
    applyDamage(t, d);
    blog(`${a.name} 攻击 ${t.name}，造成 ${d} 点伤害${t.alive?'':'，'+t.name+' 倒下了！'}`);
  }
  else if(act.type==='skill'){
    const sk = SKILLS[act.skill];
    if(act.skill==='hsqj'){
      if(a.hp<=a.maxHp*.5){blog(`${a.name} 气血不足一半，横扫千军失败。`);return;}
      const t=retarget(a,act.target);if(!t)return;
      a.hp=Math.max(1,a.hp-Math.ceil(a.maxHp*.1));a.restTurns=1;refreshSprite(a);
      for(let hit=0;hit<3&&t.alive;hit++){sfx.hit();Classic.effect(t,'hsqj');await animAttack(a,t);const damage=Math.round(physDmg(a,t)*(.9+hit*.1));applyDamage(t,damage);blog(`横扫千军 · 第${hit+1}击：${t.name} -${damage}`);}
      refreshHudFromBattle();return;
    }
    if(a.mp < sk.mp){ blog(`${a.name} 魔法不足，改为普通攻击。`); await execAction({type:'atk', actor:a, target:act.target}); return; }
    a.mp -= sk.mp;
    if(a.kind==='player'){ S.mp = a.mp; }
    if(sk.type==='heal'){
      const t = retarget2Ally(act.target);
      sfx.heal();
      const amount = Math.round(a.mag*sk.mult + 40);
      Classic.effect(t,act.skill);t.regen={amount:Math.round(amount*.5),turns:3};
      t.hp = clamp(t.hp+amount, 0, t.maxHp);
      popup(t, '+'+amount, 'heal'); refreshSprite(t);
      blog(`${a.name} 使用 ${sk.name}，${t.name} 恢复 ${amount} 点气血。`);
    } else if(sk.aoe){
      sfx.magic();
      a.el.classList.add('acting');
      a.el.style.transform = 'translate(-50%,-120%) scale(1.15)';
      await sleep(300); a.el.style.transform=''; a.el.classList.remove('acting');
      const targets = aliveOf(B.enemies);
      let msg = [];
      for(const t of targets){
        Classic.effect(t,act.skill);
        const d = sk.type==='phys' ? Math.max(1,Math.round(physDmg(a,t)*sk.mult)) : magDmg(a,t,sk.mult);
        applyDamage(t, d);
        msg.push(`${t.name} -${d}`);
      }
      await sleep(350);
      blog(`${a.name} 施展 ${sk.name}！${msg.join('，')}`);
    } else {
      const t = retarget(a, act.target); if(!t) return;
      sfx.magic();
      Classic.effect(t,act.skill);
      await animAttack(a, t);
      const d = sk.type==='fixed' ? 20+a.lv*5 : magDmg(a, t, sk.mult);
      applyDamage(t, d);
      blog(`${a.name} 施展 ${sk.name}，对 ${t.name} 造成 ${d} 点伤害${t.alive?'':'，'+t.name+' 倒下了！'}`);
    }
  }
  else if(act.type==='def'){
    a.defending = true;
    popup(a, '防御', 'info');
    blog(`${a.name} 摆出了防御姿态。`);
    await sleep(300);
  }
  else if(act.type==='item'){
    if((S.items[act.item]||0)<=0) return;
    S.items[act.item]--;
    const it = ITEMS[act.item];
    const t = retarget2Ally(act.target);
    sfx.heal();
    if(it.heal.hp){ t.hp = clamp(t.hp+it.heal.hp,0,t.maxHp); popup(t,'+'+it.heal.hp,'heal'); }
    if(it.heal.mp && t.kind==='player'){ t.mp = clamp(t.mp+it.heal.mp,0,t.maxMp); S.mp=t.mp; popup(t,'+'+it.heal.mp+'MP','heal'); }
    refreshSprite(t);
    blog(`${a.name} 使用了 ${it.name}。`);
    await sleep(350);
  }
  else if(act.type==='catch'){
    const t = act.target;
    if(!t.alive){ blog('目标已经倒下，无法捕捉。'); return; }
    a.el.style.transform = 'translate(-50%,-110%)';
    await sleep(250); a.el.style.transform='';
    const chance = 0.22 + 0.65*(1 - t.hp/t.maxHp);
    blog(`${a.name} 掏出一个乾坤袋，试图捕捉 ${t.name}……`);
    await sleep(600);
    if(Math.random() < chance){
      sfx.catch();
      popup(t, '捕捉成功！', 'info');
      t.alive = false; t.hp = 0; t.caught = true; refreshSprite(t);
      const old = S.pet;
      const st = petStats(t.mid, t.lv);
      S.pet = { mid:t.mid, name:t.name, emoji:t.emoji, lv:t.lv, exp:0,
                hp:Math.round(st.maxHp*0.5), ...st };
      blog(`🎉 捕捉成功！${t.name} 成为了你的召唤兽！`);
      if(old) blog(`原来的 ${old.name} 回归了山野……`);
      await sleep(500);
    } else {
      popup(t, '挣脱了！', 'info');
      blog(`${t.name} 挣脱了乾坤袋！`);
      await sleep(400);
    }
  }
  else if(act.type==='flee'){
    const fastest = Math.max(...aliveOf(B.enemies).map(e=>e.spd));
    const chance = clamp(0.55 + (a.spd-fastest)*0.03, 0.25, 0.95);
    if(Math.random() < chance){
      sfx.flee();
      blog('三十六计走为上，逃跑成功！');
      B.over = 'flee';
    } else {
      popup(a, '没跑掉！', 'info');
      blog('逃跑失败，被妖怪拦了回来！');
      await sleep(400);
    }
  }
  refreshHudFromBattle();
}
function retarget2Ally(orig){
  if(orig && orig.alive) return orig;
  const list = aliveOf(B.allies);
  return list[0];
}
function refreshHudFromBattle(){
  S.hp = B.me.hp; S.mp = B.me.mp;
  if(B.pet && S.pet && B.pet.savedPet===S.pet){ S.pet.hp = B.pet.hp; }
}

async function battleLoop(){
  while(!B.over){
    B.round++;
    for(const a of [...B.allies,...B.enemies]){
      a.defending=false;
      if(a.alive && a.regen?.turns>0){a.hp=Math.min(a.maxHp,a.hp+a.regen.amount);a.regen.turns--;popup(a,'+'+a.regen.amount,'heal');refreshSprite(a);}
    }
    // 收集指令
    const acts = [];
    if(B.me.alive){if(B.me.restTurns>0){B.me.restTurns--;acts.push({type:'rest',actor:B.me});}else acts.push(await getPlayerCommand());}
    if(B.pet && B.pet.alive){
      acts.push(await getPlayerCommand(B.pet));
    }
    $('#battle-menu').innerHTML = '<div class="menu-tip">回合进行中……</div>';
    $('#round-label').textContent=`第 ${B.round} 回合 · 执行中`;
    for(const e of aliveOf(B.enemies)){
      const t = aliveOf(B.allies);
      if(t.length) acts.push({type:'atk', actor:e, target:t[ri(0,t.length-1)]});
    }
    // 速度排序执行
    for(const act of acts){act.initiative=act.actor.spd+rnd(0,3);if(act.type==='def')act.actor.defending=true;}
    acts.sort((x,y)=>y.initiative-x.initiative);
    for(const act of acts){
      if(B.over) break;
      await execAction(act);
      if(battleOverCheck()) break;
      await sleep(150);
    }
    battleOverCheck();
  }
  await sleep(400);
  endBattle();
}

function endBattle(){
  const result = B.over;
  refreshHudFromBattle();
  if(result==='win'){
    if(S.quest) S.quest.kills=Math.min(3,S.quest.kills+1);
    let exp = 0, money = 0;
    B.enemies.forEach(e=>{ if(!e.caught){ exp += e.exp; money += e.money; } else { exp += Math.round(e.exp/2); } });
    money += ri(0, 10);
    S.exp += exp; S.money += money;
    const lines = [`获得经验 ${exp} 点`, `获得银两 ${money} 两`];
    // 掉落
    if(Math.random()<0.3){
      const drop = Math.random()<0.7?'baozi':'jinchuang';
      S.items[drop] = (S.items[drop]||0)+1;
      lines.push(`拾取了 ${ITEMS[drop].emoji}${ITEMS[drop].name} ×1`);
    }
    // 升级
    let leveled = false;
    while(S.exp >= expNeed(S.lv)){
      S.exp -= expNeed(S.lv); S.lv++;
      const st = classStats(S.cls, S.lv);
      Object.assign(S, st);
      S.hp = S.maxHp; S.mp = S.maxMp;
      lines.push(`🎉 等级提升！现在是 Lv.${S.lv}`);
      leveled = true;
    }
    if(S.pet){
      S.pet.exp += Math.round(exp*0.8);
      while(S.pet.exp >= petExpNeed(S.pet.lv)){
        S.pet.exp -= petExpNeed(S.pet.lv); S.pet.lv++;
        const st = petStats(S.pet.mid, S.pet.lv);
        const hpPct = S.pet.hp/S.pet.maxHp;
        Object.assign(S.pet, st);
        S.pet.hp = Math.round(st.maxHp*Math.max(hpPct,0.6));
        lines.push(`${S.pet.emoji}${S.pet.name} 升到了 Lv.${S.pet.lv}`);
      }
    }
    if(leveled) sfx.levelup(); else sfx.catch();
    $('#result-box h2').textContent = '战斗胜利';
    $('#result-box .lines').innerHTML = lines.join('<br>');
    $('#battle-result').classList.add('show');
    $('#btn-result-ok').onclick = ()=>{ backToMap(); };
  } else if(result==='lose'){
    $('#result-box h2').textContent = '战斗失败';
    $('#result-box .lines').innerHTML = '你眼前一黑……<br>醒来时发现自己躺在长安客栈里。<br>（白无常似乎把你送了回来）';
    $('#battle-result').classList.add('show');
    $('#btn-result-ok').onclick = ()=>{
      S.hp = Math.max(1, Math.round(S.maxHp*0.3)); S.mp = Math.round(S.maxMp*0.3);
      if(S.pet) S.pet.hp = Math.max(1, Math.round(S.pet.maxHp*0.3));
      backToMap('changan', 48, 60);
    };
  } else { // flee
    backToMap();
  }
}
function backToMap(scene, px, py){
  inBattle = false; B = null;
  if(scene) enterMap(scene, px, py);
  else enterMap(S.scene, S.px, S.py);
  save();
  updateHUD();
}

/* ==================== 初始化 ==================== */
(function init(){
  $('#btn-continue').disabled = !load();
  renderSelect();
  Classic.init();
  World.init();
})();
</script>
